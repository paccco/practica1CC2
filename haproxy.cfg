global
    log stdout format raw local0 info

defaults
    mode http
    timeout client 10s
    timeout connect 5s
    timeout server 10s
    log global

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 10s

frontend myfrontend
    # Puerto interno del contenedor
    bind :80
    default_backend owncloud_servers

backend owncloud_servers
    balance roundrobin
    # Servicios
    server s1 owncloud1:80 check
    server s2 owncloud2:80 check
